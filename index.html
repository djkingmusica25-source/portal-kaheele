    <style>
        :root {
            --bg-dark: #07030d;

        * {
            margin: 0;

            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
        }

        .portal-card {
            background: linear-gradient(180deg, #210b3d 0%, #5d17a3 65%, rgb(35, 37, 112) 100%);
            border: 1px solid rgba(148, 16, 16, 0.1);
            border-radius: 40px;
            padding: 50px 35px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CORRECCIÓN DEL LOGO */
        .logo-container {
            margin-bottom: 20px;
            width: 120px; /* Tamaño definido para visibilidad */
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-logo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la proporción sin deformarse */
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* --- Resto del CSS se mantiene igual para conservar tu diseño --- */
        .system-text { font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .portal-text { font-size: 0.9rem; font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--text-main); text-transform: uppercase; margin-bottom: 25px; }
        .search-container { width: 100%; margin-bottom: 25px; }
        .search-input { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px 20px; border-radius: 20px; color: #fff; text-align: center; }
        .file-item { display: none; width: 100%; margin-bottom: 20px; }
        .track-info-box { background: rgba(0, 0, 0, 0.55); padding: 20px; border-radius: 20px; }
        .btn-download { display: block; width: 100%; padding: 15px; margin-top: 10px; background: rgba(255,255,255,0.1); color: white; text-decoration: none; border-radius: 15px; }
